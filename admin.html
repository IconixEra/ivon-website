<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IVON ADMIN</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        .dashboard {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(200px, 1fr)
                );
            gap: 15px;
            margin: 20px 0;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .card h3 {
            margin-top: 0;
            color: #cbd5e1;
        }

        .message-card {
            background: #1e293b;
            padding: 20px;
            margin: 15px 0;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .timestamp {
            color: #94a3b8;
            font-size: 14px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 8px;
            font-weight: bold;
        }

        .edit {
            background: #f59e0b;
        }

        .delete {
            background: #ef4444;
            color: white;
        }

        .refresh {
            background: #2563eb;
            color: white;
            width: 100%;
            margin-top: 20px;
        }

        .logout {
            background: #dc2626;
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .online {
            color: #22c55e;
        }

        .offline {
            color: #ef4444;
        }

        #searchInput {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            font-size: 16px;
            outline: none;
        }

        #searchInput:focus {
            border-color: #64748b;
        }

        #searchInput::placeholder {
            color: #94a3b8;
        }

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .container {
                width: 100%;
            }

            h1 {
                font-size: 26px;
            }

            .dashboard {
                grid-template-columns: 1fr;
                gap: 10px;
                margin: 15px 0;
            }

            .card {
                padding: 16px;
            }

            .message-card {
                padding: 16px;
                margin: 12px 0;
            }

            .message-card button {
                width: 48%;
                margin-right: 1%;
                margin-top: 8px;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        🔐 IVON ADMIN
    </h1>


    <p>
        🧪 Testing connection to Python...
    </p>


    <hr>


    <h2>
        📊 Dashboard
    </h2>


    <div class="dashboard">


        <div class="card">

            <h3>
                📩 Total Messages
            </h3>

            <h2 id="messageCount">
                0
            </h2>

        </div>


        <div class="card">

            <h3>
                🟢 Python Server
            </h3>

            <h2
                id="serverStatus"
                class="online"
            >
                Checking...
            </h2>

        </div>


        <div class="card">

            <h3>
                🕐 Latest Message
            </h3>

            <div id="latestMessage">
                Loading...
            </div>

        </div>


        <div class="card">

            <h3>
                📅 Messages Today
            </h3>

            <h2 id="todayMessages">
                0
            </h2>

        </div>


        <div class="card">

            <h3>
                📧 Unique Senders
            </h3>

            <h2 id="uniqueSenders">
                0
            </h2>

        </div>


        <div class="card">

            <h3>
                📈 Messages This Week
            </h3>

            <h2 id="weekMessages">
                0
            </h2>

        </div>


    </div>


    <hr>


    <h2>
        📩 Messages
    </h2>


    <input
        type="text"
        id="searchInput"
        placeholder="🔎 Search messages..."
        oninput="searchMessages()"
    >


    <div id="messages">
        ⏳ Loading...
    </div>


    <button
        class="refresh"
        onclick="loadMessages()"
    >

        🔄 Refresh Dashboard

    </button>


    <button
        class="logout"
        onclick="logout()"
    >

        🚪 Logout

    </button>


</div>


<script>


let allMessages = [];



/* =====================================
   ⏰ FORMAT TIMESTAMP
   ===================================== */

function formatTimestamp(timestamp) {

    if (!timestamp) {
        return "Time unavailable";
    }

    const date =
        new Date(
            timestamp.replace(
                " ",
                "T"
            )
        );

    if (
        isNaN(
            date.getTime()
        )
    ) {
        return timestamp;
    }

    return date.toLocaleString(
        undefined,
        {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}



/* =====================================
   📅 TODAY
   ===================================== */

function getTodayDate() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}



/* =====================================
   📈 START OF WEEK
   ===================================== */

function getStartOfWeek() {

    const date =
        new Date();

    const day =
        date.getDay();

    const difference =
        day === 0
            ? 6
            : day - 1;

    date.setDate(
        date.getDate() -
        difference
    );

    date.setHours(
        0,
        0,
        0,
        0
    );

    return date;

}



/* =====================================
   📩 LOAD MESSAGES
   ===================================== */

function loadMessages() {

    fetch(
        "/api/messages",
        {
            cache: "no-store"
        }
    )

    .then(
        function(response) {

            console.log(
                "Response received:",
                response.status
            );

            if (
                !response.ok
            ) {

                throw new Error(
                    "Server returned " +
                    response.status
                );

            }

            return response.json();

        }
    )

    .then(
        function(messages) {

            console.log(
                "Messages:",
                messages
            );


            allMessages =
                messages;


            /* TOTAL */

            document.getElementById(
                "messageCount"
            ).textContent =
                messages.length;


            /* SERVER */

            document.getElementById(
                "serverStatus"
            ).textContent =
                "Online";


            document.getElementById(
                "serverStatus"
            ).className =
                "online";


            /* TODAY */

            const today =
                getTodayDate();


            const todayCount =
                messages.filter(
                    function(message) {

                        if (
                            !message.created_at
                        ) {
                            return false;
                        }

                        return message.created_at
                            .startsWith(
                                today
                            );

                    }
                ).length;


            document.getElementById(
                "todayMessages"
            ).textContent =
                todayCount;


            /* UNIQUE SENDERS */

            const uniqueEmails =
                new Set();


            messages.forEach(
                function(message) {

                    if (
                        message.email
                    ) {

                        uniqueEmails.add(
                            message.email
                                .trim()
                                .toLowerCase()
                        );

                    }

                }
            );


            document.getElementById(
                "uniqueSenders"
            ).textContent =
                uniqueEmails.size;


            /* THIS WEEK */

            const weekStart =
                getStartOfWeek();


            const weekCount =
                messages.filter(
                    function(message) {

                        if (
                            !message.created_at
                        ) {
                            return false;
                        }

                        const messageDate =
                            new Date(
                                message.created_at
                                    .replace(
                                        " ",
                                        "T"
                                    )
                            );


                        return (
                            !isNaN(
                                messageDate.getTime()
                            ) &&
                            messageDate >=
                                weekStart
                        );

                    }
                ).length;


            document.getElementById(
                "weekMessages"
            ).textContent =
                weekCount;


            /* EMPTY */

            if (
                messages.length === 0
            ) {

                document.getElementById(
                    "latestMessage"
                ).innerHTML =
                    "📭 No messages yet.";

                displayMessages(
                    []
                );

                return;

            }


            /* LATEST */

            const latest =
                messages[0];


            document.getElementById(
                "latestMessage"
            ).innerHTML = `

                <p>
                    👤 ${latest.name || ""}
                </p>

                <p>
                    📧 ${latest.email || ""}
                </p>

                <p>
                    💬 ${latest.message || ""}
                </p>

                <p class="timestamp">

                    🕐 ${
                        formatTimestamp(
                            latest.created_at
                        )
                    }

                </p>

            `;


            displayMessages(
                messages
            );

        }
    )

    .catch(
        function(error) {

            console.error(
                "ERROR:",
                error
            );


            document.getElementById(
                "serverStatus"
            ).textContent =
                "Offline";


            document.getElementById(
                "serverStatus"
            ).className =
                "offline";


            document.getElementById(
                "latestMessage"
            ).innerHTML =
                "❌ Failed to load.";


            document.getElementById(
                "messages"
            ).innerHTML =
                "❌ Failed to load messages.";

        }
    );

}



/* =====================================
   📩 DISPLAY MESSAGES
   ===================================== */

function displayMessages(messages) {

    const container =
        document.getElementById(
            "messages"
        );


    container.innerHTML =
        "";


    if (
        messages.length === 0
    ) {

        container.innerHTML =
            "<p>📭 No messages found.</p>";

        return;

    }


    messages.forEach(
        function(message) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "message-card";


            item.innerHTML = `

                <h3>
                    👤 ${message.name || ""}
                </h3>

                <p>
                    📧 ${message.email || ""}
                </p>

                <p>
                    💬 ${message.message || ""}
                </p>

                <p class="timestamp">

                    🕐 ${
                        formatTimestamp(
                            message.created_at
                        )
                    }

                </p>


                <button
                    class="edit"
                    onclick="
                        editMessage(
                            ${message.id}
                        )
                    "
                >

                    ✏️ Edit

                </button>


                <button
                    class="delete"
                    onclick="
                        deleteMessage(
                            ${message.id}
                        )
                    "
                >

                    🗑️ Delete

                </button>

            `;


            container.appendChild(
                item
            );

        }
    );

}



/* =====================================
   🔎 SEARCH
   ===================================== */

function searchMessages() {

    const search =
        document.getElementById(
            "searchInput"
        ).value
            .toLowerCase()
            .trim();


    const cards =
        document.querySelectorAll(
            ".message-card"
        );


    cards.forEach(
        function(card) {

            const text =
                card.textContent
                    .toLowerCase();


            if (
                text.includes(
                    search
                )
            ) {

                card.style.display =
                    "block";

            } else {

                card.style.display =
                    "none";

            }

        }
    );

}



/* =====================================
   ✏️ EDIT MESSAGE
   ===================================== */

function editMessage(id) {

    const message =
        allMessages.find(
            function(item) {

                return item.id === id;

            }
        );


    if (!message) {

        alert(
            "❌ Message not found."
        );

        return;

    }


    const name =
        prompt(
            "👤 Enter the name:",
            message.name || ""
        );


    if (
        name === null
    ) {
        return;
    }


    const email =
        prompt(
            "📧 Enter the email:",
            message.email || ""
        );


    if (
        email === null
    ) {
        return;
    }


    const newMessage =
        prompt(
            "💬 Enter the new message:",
            message.message || ""
        );


    if (
        newMessage === null
    ) {
        return;
    }


    if (
        name.trim() === "" ||
        email.trim() === "" ||
        newMessage.trim() === ""
    ) {

        alert(
            "⚠️ All fields are required."
        );

        return;

    }


    fetch(
        "/api/update-message",
        {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify({

                    id:
                        id,

                    name:
                        name,

                    email:
                        email,

                    message:
                        newMessage

                })

        }
    )

    .then(
        function(response) {

            return response.json();

        }
    )

    .then(
        function(result) {

            if (
                result.success
            ) {

                alert(
                    "✅ Message updated! ✏️🚀"
                );

                loadMessages();

            } else {

                alert(
                    "❌ " +
                    (
                        result.message ||
                        "Update failed."
                    )
                );

            }

        }
    )

    .catch(
        function(error) {

            console.error(
                error
            );

            alert(
                "❌ Failed to update message."
            );

        }
    );

}



/* =====================================
   🗑️ DELETE MESSAGE
   ===================================== */

function deleteMessage(id) {

    if (
        !confirm(
            "🗑️ Delete this message?"
        )
    ) {

        return;

    }


    fetch(
        "/api/delete-message",
        {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify({

                    id:
                        id

                })

        }
    )

    .then(
        function(response) {

            return response.json();

        }
    )

    .then(
        function(result) {

            if (
                result.success
            ) {

                alert(
                    "✅ Message deleted! 🗑️"
                );

                loadMessages();

            } else {

                alert(
                    "❌ " +
                    (
                        result.message ||
                        "Delete failed."
                    )
                );

            }

        }
    )

    .catch(
        function(error) {

            console.error(
                error
            );

            alert(
                "❌ Failed to delete message."
            );

        }
    );

}



/* =====================================
   🚪 LOGOUT
   ===================================== */

function logout() {

    sessionStorage.removeItem(
        "ivonAdminLoggedIn"
    );


    window.location.href =
        "/login.html";

}



/* =====================================
   🔐 LOGIN CHECK
   ===================================== */

if (
    sessionStorage.getItem(
        "ivonAdminLoggedIn"
    ) !== "true"
) {

    window.location.href =
        "/login.html";

} else {

    loadMessages();

}


</script>


</body>

</html>
